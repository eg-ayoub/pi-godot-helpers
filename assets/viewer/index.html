<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Godot review</title>
<link rel="stylesheet" href="/viewer.css">
<script src="/viewer.js" defer></script>
</head>
<body>
<header id="top">
  <div class="bar">
    <h1 id="title">Loading review…</h1>
    <select id="review-select" aria-label="Choose a review"></select>
  </div>
  <div id="meta" class="meta"></div>
  <div id="filters" class="filters"></div>
</header>
<main>
  <nav id="toc" aria-label="Files"></nav>
  <div id="content">
    <section id="summary"></section>
    <section id="files"></section>
    <section id="extra"></section>
  </div>
</main>
<noscript>This page needs JavaScript. The same review is in review.md.</noscript>
</body>
</html>
